<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Googel</title>
<style>
:root{--bg:#fff;--fg:#202124;--mut:#5f6368;--line:#dfe1e5;--btn:#f8f9fa;--link:#1a0dab;--ac:#1a73e8}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#202124;--fg:#e8eaed;--mut:#9aa0a6;--line:#5f6368;--btn:#303134;--link:#8ab4f8;--ac:#8ab4f8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Arial,Helvetica,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header,footer{display:flex;justify-content:space-between;padding:14px 20px;gap:16px;flex-wrap:wrap}
a{color:var(--fg);text-decoration:none}a:hover{text-decoration:underline}nav{display:flex;gap:18px}.on{font-weight:bold;border-bottom:2px solid var(--ac)}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:6vh 16px 24px}
.logo{font:500 clamp(54px,14vw,88px)/1 Arial,sans-serif;letter-spacing:-2px;margin:0 0 22px}
.topic{font-size:18px;margin:0 0 6px;text-align:center}.sub{color:var(--mut);margin:0 0 18px;font-size:13px;text-align:center;max-width:520px}
.box{width:100%;max-width:584px;display:flex;align-items:center;border:1px solid var(--line);border-radius:24px;height:46px;padding:0 16px}
.box:focus-within,.box:hover{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
.box input{flex:1;border:0;outline:0;background:none;color:var(--fg);font-size:16px;height:100%}
.btns{margin:26px 0 20px}.btns button{background:var(--btn);color:var(--fg);border:1px solid var(--btn);border-radius:4px;height:36px;padding:0 16px;font-size:14px;cursor:pointer}
.btns button:hover{border-color:var(--line)}
.res{width:100%;max-width:584px}.card{background:var(--btn);border:1px solid var(--line);border-radius:12px;padding:18px}
.rank{font-size:24px;color:var(--link);margin:2px 0}.big{font-size:13px;color:var(--mut)}
.bar{height:8px;border-radius:4px;background:linear-gradient(90deg,#34a853,#fbbc05,#ea4335,#4285f4);position:relative;margin:14px 0 4px}
.bar i{position:absolute;top:-4px;width:4px;height:16px;background:var(--fg);border-radius:2px}
ul{margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:var(--mut)}li.me{color:var(--fg);font-weight:bold}li.me::before{content:"▶ "}
.pg li{display:flex;justify-content:space-between;gap:10px}.pg span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.row button,.row a{background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer;font-size:14px}
.hint{color:var(--mut);font-size:13px;margin-top:18px;text-align:center}
footer{border-top:1px solid var(--line);background:var(--btn);color:var(--mut);font-size:13px}
</style></head><body>
<header><nav><a href="#daily" id="nd">Daily</a><a href="#free" id="nf">Free play</a></nav></header>
<main>
<h1 class="logo"><span style="color:#4285f4">G</span><span style="color:#ea4335">o</span><span style="color:#fbbc05">o</span><span style="color:#4285f4">g</span><span style="color:#34a853">e</span><span style="color:#ea4335">l</span></h1>
<p class="topic" id="topic"></p>
<p class="sub" id="sub"></p>
<div class="box"><input id="q" autocomplete="off" placeholder="One word" aria-label="one word"></div>
<div class="btns"><button id="go">Google Search</button></div>
<div class="res" id="res"></div><p class="hint" id="hint"></p>
</main>
<footer><span>Googel · fewer appearances on Google’s top pages = rarer</span></footer>
<script>
var T=[["Animals","animal"],["Countries","country"],["Foods","food"],["Sports","sport"],["Musical instruments","instrument"],["Cities","city"],["Plants","plant"],["Languages","language"],["Colors","color"],["Fruits","fruit"]];
var R=["Common Googler","Casual Searcher","Tab Hoarder","Query Crafter","Long-Tail Hunter","Algorithm Whisperer","Cosmic Indexer","Intergalactic Googler"],CUT=[0,15,30,45,60,75,90,97];
var API="";   // after deploying the API, put its URL here, e.g. "https://googel-api.onrender.com"
var mode,cur,done,busy;
fetch(API+"/health").catch(function(){});   // wakes a sleeping server while the player reads the theme
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function today(){var d=new Date();return d.getUTCFullYear()+"-"+(d.getUTCMonth()+1)+"-"+d.getUTCDate()}
function rarity(n){return Math.max(0,Math.round(100-18*Math.log10(Math.max(1,n))))}
function rank(s){var r=0;CUT.forEach(function(c,i){if(s>=c)r=i});return r}
function setMode(m){mode=m;$("nd").className=m=="daily"?"on":"";$("nf").className=m=="free"?"on":"";
 cur=m=="daily"?Math.floor(Date.now()/864e5)%T.length:Math.floor(Math.random()*T.length);
 done=false;busy=false;$("res").innerHTML="";$("q").value="";$("q").disabled=false;
 $("topic").textContent=(m=="daily"?"Today’s theme: ":"Theme: ")+T[cur][0];
 $("sub").textContent="Search ONE word that fits the theme. We Google it, count how often it appears on the top pages, and the fewer times, the higher you rank.";
 $("hint").textContent=m=="daily"?"One attempt per day, same theme for everyone.":"";
 if(m=="daily"){var s=ls("googel-"+today());if(s){try{show(JSON.parse(s),true)}catch(e){}}}}
function show(r,locked){done=true;$("q").disabled=true;var s=rarity(r.total),i=rank(s);
 var L=R.map(function(n,j){return'<li class="'+(j==i?"me":"")+'">'+n+"</li>"}).reverse().join("");
 var P=r.pages.filter(function(p){return p.count}).map(function(p){var h="";try{h=new URL(p.url).hostname}catch(e){}return"<li><span>"+esc(h)+"</span><span>"+p.count+"×</span></li>"}).join("");
 $("res").innerHTML='<div class="card"><div class="big">You searched “'+esc(r.q)+'”</div><div class="rank">'+R[i]+'</div><div class="big">Appeared '+r.total+' time'+(r.total==1?"":"s")+' across '+r.pages.length+' top pages. Rarity '+s+'/100.</div><div class="bar"><i style="left:calc('+s+'% - 2px)"></i></div><ul>'+L+'</ul><ul class="pg">'+P+'</ul><div class="row"><a target="_blank" rel="noopener" href="https://www.google.com/search?q='+encodeURIComponent(r.q+" "+T[cur][1])+'">Open real Google results</a><button id="sh">Share</button>'+(mode=="free"?'<button id="nx">Next theme</button>':"")+"</div></div>";
 $("sh").onclick=function(){var t="Googel "+(mode=="daily"?today():"free")+"\n"+T[cur][0]+"\n🔍 "+R[i]+" ("+r.total+" appearances)";if(navigator.clipboard)navigator.clipboard.writeText(t)};
 if($("nx"))$("nx").onclick=function(){setMode("free")};
 if(locked)$("hint").textContent="You’ve used today’s search. Come back tomorrow or try free play."}
async function submit(){if(done||busy)return;var w=$("q").value.trim();
 if(!/^[A-Za-z\u00C0-\u024F]+(['-][A-Za-z\u00C0-\u024F]+)*$/.test(w)){$("hint").textContent="One word only, letters only. No attempt used.";return}
 busy=true;$("hint").textContent="Googling and counting on the top pages. If the server was asleep this can take a couple of minutes…";
 try{var ac=new AbortController();setTimeout(function(){ac.abort()},120000);
  var j=await (await fetch(API+"/api/score?word="+encodeURIComponent(w)+"&theme="+encodeURIComponent(T[cur][1]),{signal:ac.signal})).json();
  if(!j.ok){$("hint").textContent=j.error;busy=false;return}
  if(!j.valid){$("hint").textContent="Couldn’t find “"+w+"” used as a "+T[cur][1]+" on Google’s top pages. Try another word. No attempt used.";busy=false;return}
  var r={q:w,total:j.total,pages:j.pages};if(mode=="daily")ls("googel-"+today(),JSON.stringify(r));
  $("hint").textContent="";show(r,false)}catch(e){$("hint").textContent="Couldn’t reach the server. Is server.py running?"}
 busy=false}
$("go").onclick=submit;$("q").onkeydown=function(e){if(e.key=="Enter")submit()};
function route(){setMode(location.hash=="#free"?"free":"daily")}
window.addEventListener("hashchange",route);route();
</script></body></html>
